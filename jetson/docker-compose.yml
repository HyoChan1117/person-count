# Jetson Orin Nano(JetPack 6.x)용 compose 파일. 리포지토리 루트에서 실행한다:
#   docker compose -f jetson/docker-compose.yml up -d --build
#
# 사전 준비
# ─────────
# 1) 도커가 nvidia 런타임을 쓸 수 있어야 한다:
#      docker info | grep -i runtime   # 목록에 "nvidia"가 보여야 함
#    안 보이면 /etc/docker/daemon.json에 아래를 넣고 도커를 재시작한다(sudo systemctl restart docker):
#      {
#        "runtimes": {
#          "nvidia": { "path": "nvidia-container-runtime", "runtimeArgs": [] }
#        }
#      }
# 2) backend/.env.production, .env(리포 루트)를 Jetson 쪽에도 맞게 준비해 둔다 — git에 안
#    올라가는 파일이라(.gitignore) 다른 PC에서 쓰던 걸 그대로 복사하거나 새로 만들어야 한다.
# 3) backend/models, backend/data는 x86 쪽과 마찬가지로 볼륨으로 마운트된다. 처음 띄우는
#    거면 backend/data는 비어 있어도 되고(런타임에 채워짐), backend/models 안의 커스텀
#    YOLO 가중치(.pt)는 미리 복사해 둬야 한다.
services:
  backend:
    build:
      context: ..
      dockerfile: jetson/backend.Dockerfile
    runtime: nvidia
    env_file:
      - ../backend/.env.production
      - ../.env
    environment:
      CORS_ORIGINS: "*"
      YOLO_DEVICE: "0"
      LIVE_INFER_FPS: "10"
      LIVE_CAPTURE_FPS: "15"
      LIVE_EMIT_INTERVAL: "0.033"
    volumes:
      - ../backend/data:/app/data
      - ../backend/models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ../frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
