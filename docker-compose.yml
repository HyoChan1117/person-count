services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env.production
      - ./.env
    gpus: all
    environment:
      CORS_ORIGINS: "*"
      YOLO_DEVICE: "0"
      LIVE_INFER_FPS: "10"
      LIVE_CAPTURE_FPS: "15"
      LIVE_EMIT_INTERVAL: "0.033"
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
