services:
  backend:
    build: ./backend
    env_file: ./backend/.env.production
    gpus: all
    environment:
      CORS_ORIGINS: "*"
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
