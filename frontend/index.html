<!DOCTYPE html>
<html lang="ko" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23111A2B'/%3E%3Cg fill='none' stroke='%23E6EDF7' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='6' y='10' width='13' height='12' rx='2.5'/%3E%3Cpath d='m19 14 7-3.5v11L19 18'/%3E%3C/g%3E%3C/svg%3E" />
    <title>교실 인원 카운트 관리</title>
    <!-- 페인트 전에 테마를 적용해 새로고침 때 깜빡이지 않게 한다. 규칙은 stores/themeStore.js와 같다(저장된 'light'만 라이트). -->
    <script>
      try {
        document.documentElement.classList.toggle('dark', localStorage.getItem('theme') !== 'light')
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
